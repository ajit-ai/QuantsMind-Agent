[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "quantsmind-agent"
version = "0.7.0"
description = "QuantsMind-Agent is an AI coding-agent platform inspired by modern coding-agent workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QuantsMind" }]
keywords = ["ai", "agent", "coding-agent", "llm", "desktop", "cross-platform", "qt", "pyside6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "PySide6-Essentials>=6.7,<7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "platformdirs>=4.2",
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
]
docs = [
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
    "sphinxcontrib-mermaid>=2.1",
]
packaging = [
    "pyinstaller>=6.6",
]

[project.gui-scripts]
quantsmind-agent = "quantsmind_agent.app:main"

[project.scripts]
quantsmind-agent-cli = "quantsmind_agent.app:main"

[project.urls]
Homepage = "https://github.com/ajit-ai/QuantsMind-Agent"
Documentation = "https://github.com/ajit-ai/QuantsMind-Agent/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/quantsmind_agent"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/scripts", "/README.md"]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF",
]
ignore = [
    "E501",   # line length handled by the formatter
    "RUF001", # ambiguous unicode: allowed in documentation strings
    "B008",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/quantsmind_agent/gui/**" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["quantsmind_agent"]

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/quantsmind_agent", "tests", "scripts"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["PySide6.*"]
ignore_missing_imports = true

# PySide6's stubs pull in numpy, whose type stubs use 3.12-only syntax. Skip
# their contents rather than raising the project's minimum version.
[[tool.mypy.overrides]]
module = ["numpy.*", "numpy"]
follow_imports = "skip"
ignore_missing_imports = true

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
markers = [
    "gui: tests that instantiate Qt widgets (require an offscreen QPA)",
    "integration: tests that exercise multiple subsystems together",
    "security: tests that assert an authorization or lifecycle invariant holds",
    "slow: tests that take noticeably longer to run",
]
filterwarnings = ["error::DeprecationWarning:quantsmind_agent.*"]

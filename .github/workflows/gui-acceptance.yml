# Native GUI acceptance.
#
# The smoke suite in package.yml is headless: it proves the bundle imports Qt
# and finds its platform plugin, but it never opens a window. This workflow runs
# the packaged executable against a *real* display server and asserts that a
# titled top-level window is created and survives.
#
# What it does NOT do: verify what is drawn inside the window, or the approval
# dialog. Reaching an approval dialog requires a live model to request a tool,
# which CI has no credential for, so that remains a human desktop check. See
# docs/source/testing/manual-acceptance.rst.
name: gui-acceptance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: gui-acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux GUI (Ubuntu 22.04, x86_64, Xvfb)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system and test libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            xvfb xdotool
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,packaging]"

      - name: GUI tests against a real X display
        # QT_QPA_PLATFORM is deliberately NOT set: the point is to render on the
        # virtual X server with the real xcb platform plugin rather than the
        # offscreen one the rest of the suite uses.
        env:
          QT_QPA_PLATFORM: ""
        run: xvfb-run -a --server-args="-screen 0 1600x1000x24" python -m pytest tests/gui -q

      - name: Build executable
        run: python scripts/build_executable.py --clean

      - name: Packaged executable on a real X display
        run: xvfb-run -a --server-args="-screen 0 1600x1000x24" python scripts/gui_acceptance.py --distpath dist

      - name: Record platform
        run: |
          {
            echo "os: $(. /etc/os-release && echo "$NAME $VERSION_ID")"
            echo "arch: $(uname -m)"
            echo "kernel: $(uname -r)"
          } >> "$GITHUB_STEP_SUMMARY"

  macos:
    name: macOS GUI (macOS 14, arm64)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,packaging]"

      - name: GUI tests on the Cocoa platform plugin
        env:
          QT_QPA_PLATFORM: ""
        run: python -m pytest tests/gui -q

      - name: Build application bundle
        run: python scripts/build_executable.py --clean

      - name: Report bundle structure
        run: |
          echo "### bundle" >> "$GITHUB_STEP_SUMMARY"
          ls -1 dist >> "$GITHUB_STEP_SUMMARY"
          sw_vers >> "$GITHUB_STEP_SUMMARY"
          uname -m >> "$GITHUB_STEP_SUMMARY"

      - name: Packaged bundle launches
        # macOS runners have a window server, but System Events needs the app to
        # be registered with Launch Services. This step records what happened;
        # a failure here is reported, never silently treated as a pass.
        run: python scripts/gui_acceptance.py --distpath dist --timeout 45

  windows:
    name: Windows GUI (windows-latest, x86_64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,packaging]"

      - name: GUI tests on the real windows platform plugin
        env:
          QT_QPA_PLATFORM: ""
        run: python -m pytest tests/gui -q

      - name: Build executable
        run: python scripts/build_executable.py --clean

      - name: Packaged executable opens a window
        run: python scripts/gui_acceptance.py --distpath dist --timeout 60

      - name: Record platform
        run: |
          {
            echo "os: $((Get-CimInstance Win32_OperatingSystem).Caption)"
            echo "arch: $env:PROCESSOR_ARCHITECTURE"
          } >> $env:GITHUB_STEP_SUMMARY

  # Experimental. The verified release layout is onedir; this exists only to
  # establish evidence about one-file packaging, and is deliberately a separate
  # job so it can never affect the onedir result.
  onefile-experiment:
    name: one-file experiment (Windows, x64)
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,packaging]"

      - name: Build single-file executable
        run: python scripts/build_executable.py --clean --onefile

      - name: Measure startup and smoke test
        run: |
          $exe = "dist\QuantsMindAgent.exe"
          if (-not (Test-Path $exe)) { throw "onefile artifact missing at $exe" }
          "size_mb={0:N1}" -f ((Get-Item $exe).Length / 1MB) >> $env:GITHUB_STEP_SUMMARY
          python scripts/smoke_test_executable.py --distpath dist

      - name: One-file executable opens a window
        run: python scripts/gui_acceptance.py --distpath dist --timeout 60
name: CI

on:
  push:
    branches: [main, develop, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop, "release/**"]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Qt must never try to open a real window in CI.
  QT_QPA_PLATFORM: offscreen
  # Fail loudly instead of silently using a developer's real profile.
  QM_CONFIG_DIR: ${{ github.workspace }}/.ci-config
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint, format and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy

      - name: Secret scan
        run: python scripts/secret_scan.py

      - name: Release version and identity policy
        run: python scripts/release_policy.py

      - name: Documentation formatting
        run: python scripts/normalize_rst.py --check

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-14
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      # Qt on macOS needs no extra system packages. The workflow-level
      # QT_QPA_PLATFORM=offscreen is what lets the GUI tests run without a
      # display; macOS has no DISPLAY at all, not even on a desktop session.
      - name: Install (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: pytest tests/unit -q

      - name: Integration tests
        run: pytest tests/integration -q

# Run through scripts/run_qt_tests.py: on CPython 3.11 the interpreter
      # aborts with "none_dealloc" while finalising PySide6 objects after the
      # QApplication is gone, even though every test passes. The runner
      # disposes Qt while it is still alive and then exits with pytest's own
      # code, so a real failure still fails the build.
      - name: GUI tests
        run: python scripts/run_qt_tests.py tests/gui -q

      # Credential resolution, provider/endpoint identity and audit redaction
      # are security invariants, not conveniences. They must hold on every
      # supported OS, including the Windows target, not only on Linux.
      # Windows-only sandbox tests skip themselves before importing Windows
      # APIs; the pinned-transport and credential tests run on every OS.
      - name: Security tests
        run: pytest tests/security -q

      # The product executes real commands and touches real files. Prove the
      # safety policy on a host with no display before trusting the suite above.
      # One line on purpose: GitHub's default shell on Windows is PowerShell,
      # which does not treat a trailing backslash as a line continuation, so a
      # wrapped command silently passes "\" as an argument and pytest then
      # collects from the drive root.
      - name: Command policy and write/edit/delete unit tests
        run: pytest tests/unit/test_command_policy.py tests/unit/test_command_tools.py tests/unit/test_write_tools.py tests/unit/test_git_tools.py -q

      # The whole suite runs here, GUI tests included: they are part of the measured
      # coverage and must keep being. run_qt_tests.py disposes Qt while the
      # application is still alive and then exits with pytest's own code, so
      # coverage.xml is written before the runner leaves.
      # No coverage floor is enforced yet: the first Ubuntu py3.12 run establishes
      # the genuine baseline. A floor is proposed only after that result has been
      # reviewed.
      - name: Coverage summary
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: python scripts/run_qt_tests.py --cov=quantsmind_agent --cov-report=term-missing --cov-report=xml -q

      # `if: always()` keeps the measurement available when the coverage step
      # fails; the failing step still fails the job.
      - name: Upload coverage
        if: always() && matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Package build
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      # Read the version from the built wheel rather than importing the package:
      # this job installs only `build`, not the project itself.
      - name: Verify the wheel reports the source version
        run: python scripts/verify_version.py dist/*.whl

      - name: Verify the wheel installs and imports
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import quantsmind_agent; print(quantsmind_agent.__version__)"
          /tmp/smoke/bin/quantsmind-agent --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  # A green CI run does NOT prove the application works on a real Windows 11
  # desktop or against a real model. See
  # docs/source/qualification/manual-beta-acceptance.rst.
  manual-acceptance-required:
    name: Manual Windows 11 acceptance required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Reminder
        run: |
          echo "::notice title=Manual beta acceptance pending::"
          echo "Automated CI passed, but GUI rendering on Windows 11 and"
          echo "real-provider behaviour are NOT verified here. Run the procedures"
          echo "in docs/source/windows.rst and docs/source/testing/manual-acceptance.rst"
          echo "and record the results in"
          echo "docs/source/qualification/manual-beta-acceptance.rst."

      - name: Reminder for mutating tools
        run: |
          echo "::notice title=Beta acceptance pending::"
          echo "The product includes write/edit/delete, run_command and read-only Git."
          echo "CI proves the automated suite only. The approval prompt, a real"
          echo "write/edit/delete round trip, a real approved command and the"
          echo "command safety policy MUST be exercised by hand on Windows 11"
          echo "against a disposable workspace before v0.9.0 is treated as accepted."

name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit + integration (fast)
        run: python -m pytest tests/unit tests/integration -q --timeout=600
      - name: GUI smoke (offscreen)
        run: python -m pytest tests/gui/test_studio.py -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Lint
        run: python -m ruff check src tests
  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build unsigned portable (intermediate, never released)
        run: python scripts/build_executable.py --distpath dist-ci
      - name: Verify wheel version
        run: python scripts/verify_version.py dist/*.whl
